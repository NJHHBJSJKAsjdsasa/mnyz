name: server

on:
  push:
    paths:
      - "server/**"
      - "pymodules/**"
      - "tests/**"
      - "atlas-ui/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.js"
      - "requirements-server.txt"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "tests/**"
      - "atlas-ui/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.js"

jobs:
  boundaries:
    # Hard gate: module ownership + generated API docs must match the code.
    # No database, no services — this job is cheap enough to run first and fail fast.
    runs-on: ubuntu-latest
    env:
      ATLAS_ENV: dev
      ATLAS_DATABASE_URL: ""
      ATLAS_SKIP_SELF_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-server.txt
      - name: "Module boundaries (R1: no cross-module writes)"
        run: python scripts/check_boundaries.py
      - name: API docs are generated, not hand-edited
        run: python scripts/gen_api_docs.py --check
      - name: Doc facts match the code
        run: python scripts/doc_facts.py --check

  frontend:
    # Pure static checks — no database, no browser. Runs in parallel with `boundaries`.
    # These gates existed before but only ran locally, so regressions slipped through.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: npm ci
      - name: Type check (must stay at zero errors)
        run: npx tsc --noEmit
      - name: Frontend gates (v1 direct / Shell fetch / blur budget / file size)
        run: python scripts/check_frontend_gates.py
      - name: Logic smoke (deterministic gameplay modules)
        run: npm run test:frontend
      - name: Shader + system variant snapshots
        run: npm run check:render
      - name: Arecibo fingerprint snapshots
        run: npm run check:arecibo
      - name: Production build
        run: npx vite build --outDir dist_check --emptyOutDir

  test:
    needs: boundaries
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_DATABASE_URL: postgresql://postgres:atlas@127.0.0.1:5432/atlas
      ATLAS_TEST_DATABASE_URL: postgresql://postgres:atlas@127.0.0.1:5432/atlas_test
      ATLAS_REDIS_URL: memory://
      ATLAS_RATE_LIMIT: "off"
      ATLAS_SKIP_SELF_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-server.txt pytest
      - name: Create databases
        run: |
          psql postgresql://postgres:atlas@127.0.0.1:5432/postgres -c "CREATE DATABASE atlas"
          psql postgresql://postgres:atlas@127.0.0.1:5432/postgres -c "CREATE DATABASE atlas_test"
      - name: Migrate
        run: python -m server.cli migrate
      - name: Compile
        run: python -m compileall -q server tests pymodules
      - name: Tests
        run: python -m pytest tests -q
